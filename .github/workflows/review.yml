name: Acceptance review
on:
  workflow_dispatch:
    inputs:
      pr:
        required: true
        type: string
      decision:
        required: true
        type: choice
        options: [REQUEST_CHANGES, APPROVE]
permissions:
  contents: read
  pull-requests: write
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Submit controlled acceptance review
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr }}
          DECISION: ${{ inputs.decision }}
        run: |
          case "$PR" in *[!0-9]*|'') exit 2;; esac
          gh api --method POST "repos/$GITHUB_REPOSITORY/pulls/$PR/reviews" -f "event=$DECISION" -f "body=Acceptance fixture review: $DECISION"
